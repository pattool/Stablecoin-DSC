[networks.pyevm]
is_zksync = false


[networks.anvil]
url = "http://127.0.0.1:8545"
prompt_live = false
save_to_db = false
default_account_name = "anvil1"
chain_id = 31337


[networks.sepolia-fork]
url = "$SEPOLIA_RPC_URL" # RPC from Alchemy
default_account_name = "default1"
